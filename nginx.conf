# ─── nginx.conf — L7 load balancer for CryptoWall scale profile ───────────
# Used by docker-compose --profile scale

events {
  worker_connections 4096;
  use epoll;
}

http {
  upstream cryptowall {
    least_conn;
    server proxy-scaled:8545;
    keepalive 64;        # persistent upstream connections
  }

  server {
    listen 80;

    # Pass correlation ID through
    add_header X-Request-ID $request_id always;

    # JSON-RPC proxy endpoint
    location / {
      proxy_pass         http://cryptowall;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;

      # Buffer large batch RPC bodies
      client_max_body_size 4m;
      proxy_buffer_size    16k;
      proxy_buffers        8 16k;
    }

    # Health — bypass to any upstream instance
    location /health {
      proxy_pass         http://cryptowall;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      access_log off;
    }
  }
}
